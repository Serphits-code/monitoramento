plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def buildConfigString = { key, fallback ->
    def value = localProps.getProperty(key, fallback) ?: ''
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def buildConfigInt = { key, fallback ->
    def value = localProps.getProperty(key, fallback.toString())
    return value.isInteger() ? value : fallback.toString()
}

android {
    namespace 'br.com.objetivo.tracker'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.objetivo.tracker'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', buildConfigString('DEFAULT_SERVER_URL', '')
        buildConfigField 'String', 'DEFAULT_GPS_TOKEN', buildConfigString('DEFAULT_GPS_TOKEN', '')
        buildConfigField 'int', 'DEFAULT_TECHNICIAN_ID', buildConfigInt('DEFAULT_TECHNICIAN_ID', 1)
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}