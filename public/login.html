<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Monitoramento</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #edf2f7;
      background: #101318;
    }
    .login-shell {
      width: min(380px, calc(100vw - 32px));
      border: 1px solid #293241;
      border-radius: 8px;
      background: #191d26;
      box-shadow: 0 24px 60px rgba(0,0,0,0.34);
      overflow: hidden;
    }
    .login-header { padding: 22px 24px 16px; border-bottom: 1px solid #293241; }
    .login-header h1 { font-size: 20px; font-weight: 650; letter-spacing: 0; }
    .login-header p { margin-top: 6px; color: #95a3b8; font-size: 13px; line-height: 1.4; }
    form { padding: 22px 24px 24px; display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-size: 12px; color: #9ba7bb; text-transform: uppercase; letter-spacing: 0.4px; }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 6px;
      border: 1px solid #354052;
      background: #222735;
      color: #f7fafc;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #2f80ed; box-shadow: 0 0 0 3px rgba(47,128,237,0.16); }
    button {
      margin-top: 4px;
      padding: 11px 12px;
      border: none;
      border-radius: 6px;
      background: #2f80ed;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    #erro { min-height: 18px; color: #ff8b8b; font-size: 13px; }
  </style>
</head>
<body>
  <main class="login-shell">
    <div class="login-header">
      <h1>Monitoramento Objetivo</h1>
      <p>Acesse o mapa operacional e as rotas dos tecnicos.</p>
    </div>
    <form id="login-form">
      <label>
        Usuario
        <input id="usuario" name="usuario" autocomplete="username" autofocus required>
      </label>
      <label>
        Senha
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      </label>
      <div id="erro" role="alert"></div>
      <button id="entrar" type="submit">Entrar</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const erro = document.getElementById('erro');
    const entrar = document.getElementById('entrar');
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('return') || '/monitoramento';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      erro.textContent = '';
      entrar.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Falha no login');
        window.location.href = returnTo.startsWith('/') ? returnTo : '/monitoramento';
      } catch (err) {
        erro.textContent = err.message;
      } finally {
        entrar.disabled = false;
      }
    });
  </script>
</body>
</html>
